<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 黄金解析 · 高考 AI 陪跑社区</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="biology_data.js"></script>
<script src="math_data.js"></script>
<script src="physics_data.js"></script>
<script src="chemistry_data.js"></script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
html { overflow-x: hidden; }
.bg-cream { background: #FAFAF7; }
.text-dark { color: #1A1A1A; }
.text-muted { color: #8A8A8A; }
.no-underline { text-decoration: none; }
.dim-card { background: white; border: 1px solid #E5DDD0; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.dim-icon { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
.dim-title { font-size: 14px; font-weight: 700; color: #1A1A1A; }
.dim-body { font-size: 12px; line-height: 1.75; color: #3A3A3A; margin-top: 8px; }
.dim-body strong { color: #8B6914; }
.stem-box { background: #FDF8F0; border-left: 3px solid #C9A96E; padding: 12px 14px; border-radius: 8px; font-size: 13px; line-height: 1.8; color: #1A1A1A; }
.option-list { margin-top: 8px; }
.option-item { padding: 6px 10px; margin-bottom: 4px; border-radius: 6px; background: white; border: 1px solid #E5DDD0; font-size: 12px; }
.option-item.correct { background: #E8F7EE; border-color: #22C55E; color: #166534; font-weight: 600; }
.answer-reveal { background: linear-gradient(135deg, #1A1A1A, #2A2A2A); color: white; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; }
.diff-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; }
.variant-box { background: #F5F0E8; border-radius: 10px; padding: 12px; margin-top: 8px; }
.variant-diagram { background: white; border: 1px dashed #C9A96E; border-radius: 8px; padding: 12px; margin: 8px 0; text-align: center; font-family: 'Courier New', monospace; font-size: 11px; color: #3A3A3A; line-height: 1.6; }
.svg-figure { background: white; border: 1px solid #E5DDD0; border-radius: 10px; padding: 14px 10px 10px; margin: 10px 0; box-shadow: 0 2px 8px rgba(139,105,20,0.06); }
.svg-figure svg { background: white; }
.svg-caption { text-align: center; font-size: 10px; color: #8A8A8A; margin-top: 8px; padding: 0 10px; font-style: italic; }
.parent-box { background: linear-gradient(135deg, #FDF8F0, #FBEFD6); border-radius: 10px; padding: 14px; }
.chain-step { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #E5DDD0; }
.chain-step:last-child { border-bottom: none; }
.chain-num { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: #8B6914; color: white; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body class="bg-cream">

<div class="max-w-[480px] mx-auto bg-cream min-h-screen pb-16 relative">

	<nav class="px-4 pt-3 pb-3" style="background: white; border-bottom: 1px solid #E5DDD0;">
		<div class="flex items-center justify-between">
			<a id="back_to_papers" href="papers.html" class="flex items-center gap-1 no-underline">
				<span class="text-sm" style="color: #8B6914;">&larr;</span>
				<span class="text-[12px] font-semibold" style="color: #8B6914;">真题列表</span>
			</a>
			<div class="text-[12px] font-bold text-dark">AI 黄金解析</div>
			<span class="text-[11px]" style="color: #8B6914;">&nbsp;</span>
		</div>
	</nav>

	<!-- 题目头部 -->
	<section class="px-4 pt-4 pb-3">
		<div class="flex items-center gap-2 mb-2">
			<span class="text-[10px] px-2 py-0.5 rounded-full font-semibold" style="background:#1A1A1A;color:white;">北京 2025</span>
			<span id="subject_pill" class="text-[10px] px-2 py-0.5 rounded-full" style="background:#F5EAD5;color:#8B6914;">生物</span>
			<span id="q_type_pill" class="text-[10px] px-2 py-0.5 rounded-full" style="background:#F5EAD5;color:#8B6914;">选择题</span>
			<span id="q_score_pill" class="text-[10px] px-2 py-0.5 rounded-full" style="background:#FDF8F0;color:#8B6914;">2 分</span>
		</div>
		<h1 id="q_title" class="text-lg font-black text-dark mb-2">第 1 题</h1>

		<div class="flex items-center gap-2 mb-3">
			<span class="text-[10px] text-muted">难度系数</span>
			<div style="flex:1;height:6px;background:#F5F0E8;border-radius:3px;overflow:hidden;">
				<div id="q_diff_fill" style="height:100%;width:88%;background:#22C55E;border-radius:3px;"></div>
			</div>
			<span id="q_diff_val" class="text-[12px] font-bold" style="color:#22C55E;">0.88 简单</span>
		</div>
	</section>

	<!-- 题干 + 选项 + 答案 -->
	<section class="px-4 pb-3" id="q_stem_section">
		<div class="text-[10px] text-muted mb-2 uppercase tracking-widest">原题</div>
		<div id="q_stem" class="stem-box"></div>
		<div id="q_options" class="option-list"></div>
		<div id="q_answer" class="answer-reveal mt-3"></div>
	</section>

	<!-- 8 维度解析 -->
	<section class="px-4 pb-5" id="q_dims_section">
		<div class="flex items-center gap-3 mb-3 mt-4">
			<div class="flex-1 h-px" style="background: #E5DDD0;"></div>
			<span class="text-[10px] tracking-widest text-muted uppercase">AI 黄金解析 &middot; 8 维度</span>
			<div class="flex-1 h-px" style="background: #E5DDD0;"></div>
		</div>

		<div class="dim-card">
			<div class="flex items-center gap-2 mb-2">
				<span class="dim-icon" style="background:#FDF8F0;">&#x1F3AF;</span>
				<span class="dim-title">1 &middot; 考点定位</span>
			</div>
			<div id="dim_kaodian" class="dim-body"></div>
		</div>

		<div class="dim-card">
			<div class="flex items-center gap-2 mb-2">
				<span class="dim-icon" style="background:#FDF8F0;">&#x1F441;&#xFE0F;</span>
				<span class="dim-title">2 &middot; 看穿逻辑</span>
			</div>
			<div id="dim_luoji" class="dim-body"></div>
		</div>

		<div class="dim-card">
			<div class="flex items-center gap-2 mb-2">
				<span class="dim-icon" style="background:#FDF8F0;">&#x1F9E9;</span>
				<span class="dim-title">3 &middot; 推理链</span>
			</div>
			<div id="dim_tuili" class="dim-body"></div>
		</div>

		<div class="dim-card">
			<div class="flex items-center gap-2 mb-2">
				<span class="dim-icon" style="background:#FEECEC;">&#x26A0;&#xFE0F;</span>
				<span class="dim-title">4 &middot; 典型错解</span>
			</div>
			<div id="dim_cuojie" class="dim-body"></div>
		</div>

		<div class="dim-card">
			<div class="flex items-center gap-2 mb-2">
				<span class="dim-icon" style="background:#F5EAD5;">&#x1F504;</span>
				<span class="dim-title">5 &middot; 变式练习（含配图）</span>
			</div>
			<div id="dim_bianshi" class="dim-body"></div>
		</div>

		<div class="dim-card">
			<div class="flex items-center gap-2 mb-2">
				<span class="dim-icon" style="background:#FDF8F0;">&#x1F4C8;</span>
				<span class="dim-title">6 &middot; 命题趋势</span>
			</div>
			<div id="dim_qushi" class="dim-body"></div>
		</div>

		<div class="dim-card">
			<div class="flex items-center gap-2 mb-2">
				<span class="dim-icon" style="background:#F5EAD5;">&#x1F9D8;</span>
				<span class="dim-title">7 &middot; 解题心法</span>
			</div>
			<div id="dim_xinfa" class="dim-body"></div>
		</div>

		<div class="dim-card" style="background:linear-gradient(135deg,#FDF8F0,#FBEFD6);">
			<div class="flex items-center gap-2 mb-2">
				<span class="dim-icon" style="background:#FFFFFF;">&#x1F46A;</span>
				<span class="dim-title">8 &middot; 家长翻译</span>
			</div>
			<div id="dim_parent" class="dim-body"></div>
		</div>
	</section>

	<!-- 底部操作 -->
	<section class="px-4 pb-5">
		<div class="grid grid-cols-2 gap-2">
			<a id="prev_q_btn" href="question.html?id=1" class="block no-underline text-center rounded-xl py-3 text-[13px] font-semibold" style="background:white;border:1px solid #E5DDD0;color:#8B6914;">&larr; 上一题</a>
			<a id="next_q_btn" href="question.html?id=2" class="block no-underline text-center rounded-xl py-3 text-[13px] font-semibold text-white" style="background:#8B6914;">下一题 &rarr;</a>
		</div>
	</section>

	<section class="px-4 pb-8">
		<div class="rounded-2xl p-4" style="background: #1A1A1A;">
			<div class="text-white text-sm font-bold mb-1">&#x1F393; AI 陪跑社区</div>
			<div class="text-[11px] mb-3" style="color: #C9A96E;">北京 2025 真题，每题都配 8 维度 AI 黄金解析。全部免费。</div>
			<a id="bottom_papers_link" href="papers.html" class="block no-underline text-center rounded-xl py-2.5 text-[12px] font-semibold" style="background:#C9A96E;color:#1A1A1A;">返回真题列表 &rarr;</a>
		</div>
	</section>

	<footer class="px-4 pt-4 pb-6 text-center" style="border-top: 1px solid #E5DDD0; background: white;">
		<p class="text-[10px] text-muted">&#xA9; 2026 Me Offer &middot; AI 黄金解析 &middot; 教研专家审核</p>
	</footer>

</div>

<script>
const SUBJECT_CONFIG						= {
	biology:	{ name: '生物', data: 'BIOLOGY_DATA',	emoji: '\u1F9EC', total: 20 },
	math:		{ name: '数学', data: 'MATH_DATA',		emoji: '\u1F4D0', total: 20 },
	physics:	{ name: '物理', data: 'PHYSICS_DATA',	emoji: '\u2699\uFE0F', total: 20 },
	chemistry:	{ name: '化学', data: 'CHEMISTRY_DATA',	emoji: '\u1F9EA', total: 20 }
};

let current_subject							= 'biology';
let current_total							= 20;

function main() {
	let url_params						= new URLSearchParams(window.location.search);
	let subj_param						= url_params.get('subject') || 'biology';

	if (!SUBJECT_CONFIG[subj_param]) {
		subj_param						= 'biology';
	}

	current_subject						= subj_param;
	current_total						= SUBJECT_CONFIG[subj_param].total;

	let q_id							= parseInt(url_params.get('id') || '1');

	if (q_id < 1 || q_id > current_total) {
		q_id							= 1;
	}

	let data_obj						= window[SUBJECT_CONFIG[subj_param].data];
	let q								= data_obj ? data_obj[q_id] : null;

	if (!q) {
		render_not_found();
		return;
	}

	$('#subject_pill').text(SUBJECT_CONFIG[subj_param].name);
	$('#back_to_papers').attr('href', 'papers.html?subject=' + subj_param);
	$('#bottom_papers_link').attr('href', 'papers.html?subject=' + subj_param);
	render_question(q);
	update_nav_buttons(q_id);
}

main();

function render_question(q) {
	$('#q_title').text(q.title);
	$('#q_type_pill').text(q.type);
	$('#q_score_pill').text(q.score + ' 分');

	let color							= '#22C55E';
	let label							= '简单';

	if (q.level === 'medium') {
		color							= '#8B6914';
		label							= '中等';
	} else if (q.level === 'hard') {
		color							= '#C94A4A';
		label							= '压轴';
	}

	$('#q_diff_fill').css({ width: (q.difficulty * 100) + '%', background: color });
	$('#q_diff_val').text(q.difficulty.toFixed(2) + ' ' + label).css('color', color);

	$('#q_stem').html(q.stem);

	if (q.options && q.options.length > 0) {
		let opt_html					= '';

		for (let opt of q.options) {
			let cls						= 'option-item';
			let mark					= '';

			if (opt.correct) {
				cls						= 'option-item correct';
				mark					= ' <span style="color:#C94A4A;">&nbsp;&larr; 正确选项</span>';
			}

			opt_html					= opt_html + '<div class="' + cls + '">' + opt.label + '. ' + opt.text + mark + '</div>';
		}

		$('#q_options').html(opt_html);

		let ans_html					= '<span style="color:#C9A96E;">正确答案：</span> <span class="ml-1" style="font-size:18px;">' + q.answer + '</span>';

		if (q.answer_note) {
			ans_html					= ans_html + '<div class="text-[10px] mt-1" style="color:#AAAAAA;">（' + q.answer_note + '）</div>';
		}

		$('#q_answer').html(ans_html);
	} else {
		$('#q_options').html('');

		let ans_html					= '<span style="color:#C9A96E;">本题为</span> <span class="ml-1">' + q.type + '</span>';

		if (q.answer_note) {
			ans_html					= ans_html + '<div class="text-[10px] mt-1" style="color:#AAAAAA;">（' + q.answer_note + '）</div>';
		}

		$('#q_answer').html(ans_html);
	}

	let d								= q.dimensions;

	$('#dim_kaodian').html(d.kaodian || '');
	$('#dim_luoji').html(d.luoji || '');

	if (d.tuili_steps && d.tuili_steps.length > 0) {
		let tuili_html					= '';

		for (let i = 0; i < d.tuili_steps.length; i++) {
			tuili_html					= tuili_html + '<div class="chain-step">' +
				'<div class="chain-num">' + (i + 1) + '</div>' +
				'<div>' + d.tuili_steps[i] + '</div>' +
			'</div>';
		}

		$('#dim_tuili').html(tuili_html);
	}

	$('#dim_cuojie').html(d.cuojie || '');
	$('#dim_bianshi').html(d.bianshi || '');
	$('#dim_qushi').html(d.qushi || '');
	$('#dim_xinfa').html(d.xinfa || '');
	$('#dim_parent').html(d.parent_tr || '');
}

function update_nav_buttons(q_id) {
	let subj_qs							= 'subject=' + current_subject + '&';
	let papers_url						= 'papers.html?subject=' + current_subject;

	if (q_id <= 1) {
		$('#prev_q_btn').attr('href', papers_url).html('&larr; 返回列表');
	} else {
		$('#prev_q_btn').attr('href', 'question.html?' + subj_qs + 'id=' + (q_id - 1));
	}

	if (q_id >= current_total) {
		$('#next_q_btn').attr('href', papers_url).html('返回列表 &rarr;');
	} else {
		$('#next_q_btn').attr('href', 'question.html?' + subj_qs + 'id=' + (q_id + 1));
	}
}

function render_not_found() {
	$('#q_title').text('题目未找到');
	$('#q_stem').html('<div style="text-align:center;padding:24px;"><div style="font-size:36px;margin-bottom:8px;">&#x1F50D;</div><div style="color:#8B6914;">请从真题列表选择题目</div></div>');
	$('#q_options').html('');
	$('#q_answer').hide();
	$('#q_dims_section').hide();
}
</script>

</body>
</html>
