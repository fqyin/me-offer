<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高三真题库 · 高考 AI 陪跑社区</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="biology_data.js"></script>
<script src="math_data.js"></script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
html { overflow-x: hidden; }
.bg-cream { background: #FAFAF7; }
.text-dark { color: #1A1A1A; }
.text-muted { color: #8A8A8A; }
.no-underline { text-decoration: none; }
.filter-chip { transition: all 0.15s; cursor: pointer; }
.filter-chip.active { background: #8B6914 !important; color: white !important; }
.subj-tab { transition: all 0.15s; cursor: pointer; }
.subj-tab.active { background: #8B6914 !important; color: white !important; border-color: #8B6914 !important; }
.subj-tab.locked { opacity: 0.5; cursor: not-allowed; }
.q-card { transition: transform 0.2s, box-shadow 0.2s; }
.q-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(139,105,20,0.1); }
.difficulty-bar { height: 4px; border-radius: 2px; overflow: hidden; background: #F5F0E8; }
.difficulty-fill { height: 100%; border-radius: 2px; }
</style>
</head>
<body class="bg-cream">

<div class="max-w-[480px] mx-auto bg-cream min-h-screen pb-16 relative">

	<nav class="px-4 pt-3 pb-3" style="background: white; border-bottom: 1px solid #E5DDD0;">
		<div class="flex items-center justify-between">
			<a href="../index.html" class="flex items-center gap-1 no-underline">
				<span class="text-sm" style="color: #8B6914;">&larr;</span>
				<span class="text-[12px] font-semibold" style="color: #8B6914;">返回社区</span>
			</a>
			<div class="text-[12px] font-bold text-dark">&#x1F333; 高三真题库</div>
			<span class="text-[11px]" style="color: #8B6914;">&nbsp;</span>
		</div>
	</nav>

	<section class="px-4 pt-4 pb-3">
		<h1 class="text-2xl font-black text-dark mb-1">北京 2025 · 高三真题</h1>
		<p class="text-xs text-muted mb-3">AI 黄金解析 &middot; 教研专家审核 &middot; 全部免费</p>
	</section>

	<!-- 科目切换 -->
	<section class="px-4 pb-4">
		<div class="text-[10px] text-muted mb-2 uppercase tracking-widest">选择科目</div>
		<div class="flex flex-wrap gap-2">
			<div class="subj-tab text-[11px] px-3 py-1.5 rounded-full" data-subject="biology" onclick="switch_subject('biology')" style="background:#F5F0E8;color:#8B6914;border:1px solid #E5DDD0;">&#x1F9EC; 生物</div>
			<div class="subj-tab text-[11px] px-3 py-1.5 rounded-full" data-subject="math" onclick="switch_subject('math')" style="background:#F5F0E8;color:#8B6914;border:1px solid #E5DDD0;">&#x1F4D0; 数学</div>
			<div class="subj-tab locked text-[11px] px-3 py-1.5 rounded-full" style="background:#F5F0E8;color:#8A8A8A;border:1px solid #E5DDD0;">&#x2699;&#xFE0F; 物理 &#x1F514;</div>
			<div class="subj-tab locked text-[11px] px-3 py-1.5 rounded-full" style="background:#F5F0E8;color:#8A8A8A;border:1px solid #E5DDD0;">&#x1F9EA; 化学 &#x1F514;</div>
			<div class="subj-tab locked text-[11px] px-3 py-1.5 rounded-full" style="background:#F5F0E8;color:#8A8A8A;border:1px solid #E5DDD0;">&#x1F4DD; 语文 &#x1F514;</div>
			<div class="subj-tab locked text-[11px] px-3 py-1.5 rounded-full" style="background:#F5F0E8;color:#8A8A8A;border:1px solid #E5DDD0;">&#x1F1EC;&#x1F1E7; 英语 &#x1F514;</div>
			<div class="subj-tab locked text-[11px] px-3 py-1.5 rounded-full" style="background:#F5F0E8;color:#8A8A8A;border:1px solid #E5DDD0;">&#x1F5FA;&#xFE0F; 地理 &#x1F514;</div>
			<div class="subj-tab locked text-[11px] px-3 py-1.5 rounded-full" style="background:#F5F0E8;color:#8A8A8A;border:1px solid #E5DDD0;">&#x1F4DC; 历史 &#x1F514;</div>
			<div class="subj-tab locked text-[11px] px-3 py-1.5 rounded-full" style="background:#F5F0E8;color:#8A8A8A;border:1px solid #E5DDD0;">&#x2696;&#xFE0F; 政治 &#x1F514;</div>
		</div>
	</section>

	<!-- 统计 -->
	<section class="px-4 pb-3">
		<div class="rounded-xl p-3 mb-3" style="background: white; border: 1px solid #E5DDD0;">
			<div class="grid grid-cols-4 gap-2">
				<div class="text-center">
					<div class="text-base font-black" style="color: #8B6914;" id="stat_total">20</div>
					<div class="text-[9px] text-muted">真题</div>
				</div>
				<div class="text-center">
					<div class="text-base font-black" style="color: #22C55E;" id="stat_easy">0</div>
					<div class="text-[9px] text-muted">简单</div>
				</div>
				<div class="text-center">
					<div class="text-base font-black" style="color: #8B6914;" id="stat_medium">0</div>
					<div class="text-[9px] text-muted">中等</div>
				</div>
				<div class="text-center">
					<div class="text-base font-black" style="color: #C94A4A;" id="stat_hard">0</div>
					<div class="text-[9px] text-muted">压轴</div>
				</div>
			</div>
		</div>
	</section>

	<section class="px-4 pb-3">
		<div class="text-[10px] text-muted mb-2 uppercase tracking-widest">按难度筛选</div>
		<div class="flex flex-wrap gap-1.5 mb-4">
			<span class="filter-chip active text-[10px] px-3 py-1 rounded-full" data-value="all" onclick="apply_filter('all')" style="background: #F5F0E8; color: #8B6914;">全部</span>
			<span class="filter-chip text-[10px] px-3 py-1 rounded-full" data-value="easy" onclick="apply_filter('easy')" style="background: #F5F0E8; color: #8B6914;">简单</span>
			<span class="filter-chip text-[10px] px-3 py-1 rounded-full" data-value="medium" onclick="apply_filter('medium')" style="background: #F5F0E8; color: #8B6914;">中等</span>
			<span class="filter-chip text-[10px] px-3 py-1 rounded-full" data-value="hard" onclick="apply_filter('hard')" style="background: #F5F0E8; color: #8B6914;">压轴</span>
		</div>
	</section>

	<section class="px-4 pb-8">
		<div class="flex items-center gap-3 mb-3">
			<div class="flex-1 h-px" style="background: #E5DDD0;"></div>
			<span class="text-[10px] tracking-widest text-muted uppercase">QUESTIONS · 真题列表</span>
			<div class="flex-1 h-px" style="background: #E5DDD0;"></div>
		</div>

		<div id="question_list"></div>
	</section>

	<footer class="px-4 pt-4 pb-6 text-center" style="border-top: 1px solid #E5DDD0; background: white;">
		<p class="text-[10px] text-muted">&#xA9; 2026 Me Offer &middot; 高三真题库 &middot; 教研专家审核</p>
	</footer>

</div>

<script>
const SUBJECT_DATA_MAP						= {
	biology:	{ name: '生物', data_obj: 'BIOLOGY_DATA', total: 20 },
	math:		{ name: '数学', data_obj: 'MATH_DATA',		total: 20 }
};

let current_subject							= 'biology';
let current_filter							= 'all';

function main() {
	let url_params						= new URLSearchParams(window.location.search);
	let subj							= url_params.get('subject') || 'biology';

	if (!SUBJECT_DATA_MAP[subj]) {
		subj							= 'biology';
	}

	current_subject						= subj;
	update_subj_tabs();
	render_stats();
	render_questions();
}

main();

function switch_subject(subj) {
	if (!SUBJECT_DATA_MAP[subj]) return;

	current_subject						= subj;
	current_filter						= 'all';

	let url								= new URL(window.location.href);
	url.searchParams.set('subject', subj);
	window.history.replaceState({}, '', url);

	update_subj_tabs();
	render_stats();

	$('.filter-chip').removeClass('active');
	$('.filter-chip[data-value="all"]').addClass('active');
	render_questions();
}

function update_subj_tabs() {
	$('.subj-tab').removeClass('active');
	$('.subj-tab[data-subject="' + current_subject + '"]').addClass('active');
}

function apply_filter(value) {
	current_filter						= value;
	$('.filter-chip').removeClass('active');
	$('.filter-chip[data-value="' + value + '"]').addClass('active');
	render_questions();
}

function get_current_data() {
	let data_key						= SUBJECT_DATA_MAP[current_subject].data_obj;
	return window[data_key] || {};
}

function render_stats() {
	let data							= get_current_data();
	let total							= 0;
	let easy							= 0;
	let medium							= 0;
	let hard							= 0;

	for (let k in data) {
		let q							= data[k];
		total++;

		if (q.level === 'easy') easy++;
		else if (q.level === 'medium') medium++;
		else if (q.level === 'hard') hard++;
	}

	$('#stat_total').text(total);
	$('#stat_easy').text(easy);
	$('#stat_medium').text(medium);
	$('#stat_hard').text(hard);
}

function render_questions() {
	let data							= get_current_data();
	let items							= [];

	for (let k in data) {
		let q							= data[k];

		if (current_filter === 'all' || q.level === current_filter) {
			items.push(q);
		}
	}

	items.sort(function(a, b) { return a.no - b.no; });

	if (items.length === 0) {
		$('#question_list').html('<div class="text-center text-muted text-xs py-8">该筛选条件下暂无真题</div>');
		return;
	}

	let html_arr						= [];

	for (let q of items) {
		let diff_color					= '#22C55E';
		let diff_label					= '简单';

		if (q.level === 'medium') {
			diff_color					= '#8B6914';
			diff_label					= '中等';
		} else if (q.level === 'hard') {
			diff_color					= '#C94A4A';
			diff_label					= '压轴';
		}

		let diff_pct					= Math.round(q.difficulty * 100);
		let tag_html					= '';
		let tags						= q.knowledge_tags || q.tags || [];

		if (!tags.length && q.dimensions && q.dimensions.kaodian) {
			tags						= [];
		}

		let card_html					= '<a href="question.html?subject=' + current_subject + '&id=' + q.no + '" class="q-card block no-underline rounded-xl p-3 mb-2" style="background:white;border:1px solid #E5DDD0;">' +
			'<div class="flex items-center gap-2 mb-1">' +
				'<span class="text-[10px] px-2 py-0.5 rounded-full font-semibold" style="background:#1A1A1A;color:white;">第 ' + q.no + ' 题</span>' +
				'<span class="text-[9px] px-1.5 py-0.5 rounded" style="background:#F5F0E8;color:#8B6914;">' + q.type + '</span>' +
				'<span class="text-[9px] px-1.5 py-0.5 rounded" style="background:#FDF8F0;color:#8B6914;">' + q.score + ' 分</span>' +
				'<span class="ml-auto text-[10px] font-bold" style="color:' + diff_color + ';">' + diff_label + '</span>' +
			'</div>' +
			'<div class="text-sm font-bold text-dark mb-2">' + q.title + '</div>' +
			'<div class="flex items-center gap-2">' +
				'<span class="text-[9px] text-muted">难度系数</span>' +
				'<div class="difficulty-bar flex-1">' +
					'<div class="difficulty-fill" style="width:' + diff_pct + '%;background:' + diff_color + ';"></div>' +
				'</div>' +
				'<span class="text-[10px] font-bold" style="color:' + diff_color + ';">' + q.difficulty.toFixed(2) + '</span>' +
			'</div>' +
		'</a>';

		html_arr.push(card_html);
	}

	$('#question_list').html(html_arr.join(''));
}
</script>

</body>
</html>
