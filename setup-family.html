<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>完善家庭资料 · Me Offer</title>
	<link rel="shortcut icon" href="/meuni_logo.jpg">
	<script src="https://meuni-nutrition.oss-cn-beijing.aliyuncs.com/libs/tailwind.min.js"></script>
	<script src="https://meuni-nutrition.oss-cn-beijing.aliyuncs.com/libs/jquery-3.7.1.min.js"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						brand:		'#8B6914',
						gold:		'#C9A96E',
						danger:		'#C94A4A',
						cream:		'#FDF8F0',
						muted:		'#8A8A8A',
						ink:		'#2C2416'
					}
				}
			}
		}
	</script>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { font-family: 'Helvetica', 'Arial', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #FDF8F0; color: #1A1A1A; }

		.fade-in { animation: fadeIn 0.5s ease-out; }
		@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

		.chinese-serif { font-family: 'Georgia', 'STSong', 'SimSun', serif; }

		.stamp { display: inline-block; border: 2px solid #8B6914; color: #8B6914; padding: 2px 8px; font-size: 10px; font-weight: bold; transform: rotate(-3deg); letter-spacing: 1px; }

		.btn-primary { background: #8B6914; color: white; }
		.btn-primary:hover { background: #6B4F0F; }
		.btn-primary:disabled { background: #C9A96E; cursor: not-allowed; opacity: 0.6; }
		.btn-ghost { border: 1px solid #8B6914; color: #8B6914; background: white; }
		.btn-ghost:hover { background: #FDF8F0; }

		.form-input {
			width: 100%;
			padding: 14px 16px;
			border-radius: 12px;
			background: white;
			border: 2px solid #E5DDD0;
			font-size: 15px;
			outline: none;
		}
		.form-input:focus { border-color: #C9A96E; }

		.relation-card { transition: all 0.2s; cursor: pointer; border: 2px solid #E5DDD0; }
		.relation-card:hover { border-color: #C9A96E; background: #FDF8F0; }
		.relation-card.selected { border-color: #8B6914; background: #FDF8F0; }

		.hero-bg {
			background:
				radial-gradient(circle at 20% 20%, rgba(201,169,110,0.15) 0%, transparent 40%),
				radial-gradient(circle at 80% 80%, rgba(139,105,20,0.1) 0%, transparent 40%),
				#FDF8F0;
		}

		.step-indicator {
			display: flex; align-items: center; gap: 8px;
			background: white;
			padding: 10px 14px;
			border-radius: 20px;
			border: 1px solid #E5DDD0;
			font-size: 11px;
			color: #8A8A8A;
		}

		.motto-preview {
			font-family: 'STKaiti', 'Kaiti SC', serif;
			letter-spacing: 6px;
			text-align: center;
			color: #8B6914;
			background: linear-gradient(135deg, #FDF8F0 0%, white 50%, #FDF8F0 100%);
			padding: 20px;
			border-radius: 12px;
			border: 1px dashed #C9A96E;
		}
	</style>
</head>
<body class="hero-bg">

<div class="max-w-[480px] mx-auto min-h-screen pb-8">

	<!-- Header -->
	<header class="px-6 pt-10 pb-6 text-center fade-in">
		<div class="step-indicator inline-flex mb-4">
			<span class="w-5 h-5 rounded-full bg-brand text-white flex items-center justify-center font-bold text-[10px]">1</span>
			<span>家庭资料</span>
			<span class="text-muted">›</span>
			<span>孩子档案</span>
			<span class="text-muted">›</span>
			<span>开始陪跑</span>
		</div>
		<h1 class="text-2xl font-bold chinese-serif text-ink mb-2">🏡 给你的家一个名字</h1>
		<p class="text-xs text-muted">家庭账号下可管理多个孩子 · 全家共享陪跑数据</p>
	</header>

	<!-- Main -->
	<main class="px-6 space-y-5 fade-in">

		<!-- 家庭名 -->
		<div class="bg-white rounded-2xl p-5 border border-[#E5DDD0]">
			<label class="block text-xs font-bold text-brand mb-2">家庭名称 <span class="text-danger">*</span></label>
			<input
				type="text"
				id="family_name"
				class="form-input chinese-serif"
				placeholder="例如：吕同学之家"
				maxlength="20"
			>
			<div class="text-[10px] text-muted mt-2">✨ 建议使用孩子的姓氏 + "之家"，如「吕同学之家」「张家」</div>
		</div>

		<!-- 家训（选填） -->
		<div class="bg-white rounded-2xl p-5 border border-[#E5DDD0]">
			<label class="block text-xs font-bold text-brand mb-2">家训 <span class="text-muted font-normal">（选填，让家更有仪式感）</span></label>
			<input
				type="text"
				id="family_motto"
				class="form-input chinese-serif"
				placeholder="例如：敬学勤思、守拙笃行"
				maxlength="20"
			>

			<!-- 家训预览 -->
			<div id="motto_preview_box" class="mt-4 hidden">
				<div class="text-[10px] text-muted mb-2">预览效果：</div>
				<div class="motto-preview" id="motto_preview"></div>
			</div>

			<!-- 推荐家训 -->
			<div class="mt-3">
				<div class="text-[10px] text-muted mb-2">📜 试试这些经典家训：</div>
				<div class="flex flex-wrap gap-2">
					<span class="motto-chip cursor-pointer bg-cream border border-[#E5DDD0] text-[11px] px-2.5 py-1 rounded-full chinese-serif hover:border-gold" data-motto="敬学勤思">敬学勤思</span>
					<span class="motto-chip cursor-pointer bg-cream border border-[#E5DDD0] text-[11px] px-2.5 py-1 rounded-full chinese-serif hover:border-gold" data-motto="守拙笃行">守拙笃行</span>
					<span class="motto-chip cursor-pointer bg-cream border border-[#E5DDD0] text-[11px] px-2.5 py-1 rounded-full chinese-serif hover:border-gold" data-motto="博学慎思">博学慎思</span>
					<span class="motto-chip cursor-pointer bg-cream border border-[#E5DDD0] text-[11px] px-2.5 py-1 rounded-full chinese-serif hover:border-gold" data-motto="温良恭俭">温良恭俭</span>
					<span class="motto-chip cursor-pointer bg-cream border border-[#E5DDD0] text-[11px] px-2.5 py-1 rounded-full chinese-serif hover:border-gold" data-motto="诚朴雄伟">诚朴雄伟</span>
				</div>
			</div>
		</div>

		<!-- 家长信息 -->
		<div class="bg-white rounded-2xl p-5 border border-[#E5DDD0]">
			<label class="block text-xs font-bold text-brand mb-2">你是孩子的 <span class="text-danger">*</span></label>
			<div class="grid grid-cols-4 gap-2">
				<div class="relation-card rounded-xl p-3 text-center" data-relation="father">
					<div class="text-2xl mb-1">👨</div>
					<div class="text-xs">爸爸</div>
				</div>
				<div class="relation-card rounded-xl p-3 text-center" data-relation="mother">
					<div class="text-2xl mb-1">👩</div>
					<div class="text-xs">妈妈</div>
				</div>
				<div class="relation-card rounded-xl p-3 text-center" data-relation="grandparent">
					<div class="text-2xl mb-1">👴</div>
					<div class="text-xs">爷爷/奶奶</div>
				</div>
				<div class="relation-card rounded-xl p-3 text-center" data-relation="guardian">
					<div class="text-2xl mb-1">👤</div>
					<div class="text-xs">监护人</div>
				</div>
			</div>

			<label class="block text-xs font-bold text-brand mt-5 mb-2">真实姓名 <span class="text-danger">*</span></label>
			<input
				type="text"
				id="real_name"
				class="form-input chinese-serif"
				placeholder="例如：吕建国"
				maxlength="20"
			>
			<div class="text-[10px] text-muted mt-2">🔒 姓名仅用于生成《成长档案》签字页 · 不会公开</div>
		</div>

		<!-- 地区 -->
		<div class="bg-white rounded-2xl p-5 border border-[#E5DDD0]">
			<label class="block text-xs font-bold text-brand mb-2">所在地区 <span class="text-muted font-normal">（选填）</span></label>
			<div class="grid grid-cols-2 gap-3">
				<select id="province" class="form-input">
					<option value="">选择省份</option>
					<option value="山东">山东</option>
					<option value="北京">北京</option>
					<option value="上海">上海</option>
					<option value="广东">广东</option>
					<option value="江苏">江苏</option>
					<option value="浙江">浙江</option>
					<option value="四川">四川</option>
					<option value="河南">河南</option>
					<option value="河北">河北</option>
					<option value="湖北">湖北</option>
					<option value="湖南">湖南</option>
					<option value="福建">福建</option>
					<option value="安徽">安徽</option>
					<option value="江西">江西</option>
					<option value="辽宁">辽宁</option>
					<option value="陕西">陕西</option>
					<option value="重庆">重庆</option>
					<option value="天津">天津</option>
					<option value="山西">山西</option>
					<option value="吉林">吉林</option>
					<option value="黑龙江">黑龙江</option>
					<option value="云南">云南</option>
					<option value="贵州">贵州</option>
					<option value="广西">广西</option>
					<option value="甘肃">甘肃</option>
					<option value="青海">青海</option>
					<option value="海南">海南</option>
					<option value="宁夏">宁夏</option>
					<option value="内蒙古">内蒙古</option>
					<option value="新疆">新疆</option>
					<option value="西藏">西藏</option>
				</select>
				<input type="text" id="city" class="form-input" placeholder="城市" maxlength="20">
			</div>
		</div>

		<!-- 提交 -->
		<button id="btn_submit" class="btn-primary w-full py-4 rounded-xl font-semibold text-sm shadow-lg" disabled>
			<span id="submit_text">下一步：添加孩子</span>
		</button>

		<button onclick="logout()" class="w-full text-[11px] text-muted py-2">← 退出重登</button>

	</main>

</div>

<script>
	const api_base = location.origin;
	const token = localStorage.getItem('me_offer_token');
	let selected_relation = '';

	if (!token) {
		location.href = 'login.html';
	}

	$(function () {
		/* 预填现有信息 */
		$.ajax({
			url:		api_base + '/api/auth/me',
			method:		'GET',
			headers:	{ 'Authorization': 'Bearer ' + token },
			success:	function (data) {
				if (data.family) {
					if (!/^家长\d{4}之家$/.test(data.family.family_name)) {
						$('#family_name').val(data.family.family_name);
					}
					if (data.family.family_motto) {
						$('#family_motto').val(data.family.family_motto).trigger('input');
					}
					if (data.family.province) $('#province').val(data.family.province);
					if (data.family.city) $('#city').val(data.family.city);
				}
				if (data.parent) {
					if (data.parent.real_name) $('#real_name').val(data.parent.real_name);
					if (data.parent.relation) {
						selected_relation = data.parent.relation;
						$('.relation-card[data-relation="' + data.parent.relation + '"]').addClass('selected');
					}
				}
				check_valid();
			},
			error:		function () {
				localStorage.removeItem('me_offer_token');
				location.href = 'login.html';
			}
		});

		/* 关系卡片 */
		$('.relation-card').on('click', function () {
			$('.relation-card').removeClass('selected');
			$(this).addClass('selected');
			selected_relation = $(this).data('relation');
			check_valid();
		});

		/* 家训预览 */
		$('#family_motto').on('input', function () {
			const v = $(this).val().trim();
			if (v) {
				$('#motto_preview').text(v);
				$('#motto_preview_box').removeClass('hidden');
			} else {
				$('#motto_preview_box').addClass('hidden');
			}
		});

		/* 推荐家训 */
		$('.motto-chip').on('click', function () {
			$('#family_motto').val($(this).data('motto')).trigger('input');
		});

		/* 校验 */
		$('#family_name, #real_name').on('input', check_valid);

		/* 提交 */
		$('#btn_submit').on('click', submit_family);
	});

	function check_valid() {
		const ok = $('#family_name').val().trim() &&
			$('#real_name').val().trim() &&
			selected_relation;
		$('#btn_submit').prop('disabled', !ok);
	}

	function submit_family() {
		$('#btn_submit').prop('disabled', true);
		$('#submit_text').text('保存中...');

		$.ajax({
			url:			api_base + '/api/family/update',
			method:			'POST',
			contentType:	'application/json',
			headers:		{ 'Authorization': 'Bearer ' + token },
			data:			JSON.stringify({
				family_name:	$('#family_name').val().trim(),
				family_motto:	$('#family_motto').val().trim(),
				province:		$('#province').val(),
				city:			$('#city').val().trim(),
				real_name:		$('#real_name').val().trim(),
				relation:		selected_relation
			}),
			success:	function () {
				location.href = 'add-child.html';
			},
			error:		function (xhr) {
				$('#btn_submit').prop('disabled', false);
				$('#submit_text').text('下一步：添加孩子');
				alert(xhr.responseJSON ? xhr.responseJSON.error : '保存失败，请重试');
			}
		});
	}

	function logout() {
		localStorage.removeItem('me_offer_token');
		localStorage.removeItem('me_offer_parent_id');
		location.href = 'login.html';
	}
</script>

</body>
</html>
